services:
  # =========================================================================
  # 1. PERIMETER SHIELD: CADDY REVERSE PROXY + CORAZA WAF
  # =========================================================================
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: streamcontrol_caddy_waf
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-midominio.local}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - internal_net
    depends_on:
      - authelia
      - frontend
      - backend

  # =========================================================================
  # 2. INTRUSION PREVENTION: CROWDSEC IPS
  # =========================================================================
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: streamcontrol_crowdsec
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/caddy crowdsecurity/http-crawlers crowdsecurity/base-http-scenarios
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - caddy_logs:/var/log/caddy:ro
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
    networks:
      - internal_net

  # =========================================================================
  # 3. ZERO TRUST MFA PORTAL: AUTHELIA
  # =========================================================================
  authelia:
    image: authelia/authelia:latest
    container_name: streamcontrol_authelia
    restart: unless-stopped
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users_database.yml:/config/users_database.yml:ro
      - authelia_data:/config
    networks:
      - internal_net
    depends_on:
      - redis
    environment:
      - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET:-streamcontrol_jwt_secret_mfa_2025}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET:-streamcontrol_session_secret_mfa_2025}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${AUTHELIA_STORAGE_KEY:-streamcontrol_storage_key_mfa_2025}

  # =========================================================================
  # 4. SESSION STORE FOR AUTHELIA: REDIS
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: streamcontrol_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal_net

  # =========================================================================
  # 5. KEY MANAGEMENT SERVICE: HASHICORP VAULT (TRANSIT ENGINE)
  # =========================================================================
  vault:
    image: hashicorp/vault:1.15
    container_name: streamcontrol_vault
    restart: unless-stopped
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_TOKEN:-root_token_streamcontrol_2025}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    volumes:
      - vault_data:/vault/file
    networks:
      - internal_net
    cap_add:
      - IPC_LOCK

  vault-init:
    image: hashicorp/vault:1.15
    container_name: streamcontrol_vault_init
    restart: "no"
    depends_on:
      - vault
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN:-root_token_streamcontrol_2025}
    volumes:
      - ./vault/init-transit.sh:/init-transit.sh:ro
    entrypoint: ["/bin/sh", "/init-transit.sh"]
    networks:
      - internal_net

  # =========================================================================
  # 6. OBSERVABILITY STACK: PROMETHEUS & GRAFANA
  # =========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: streamcontrol_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - internal_net

  grafana:
    image: grafana/grafana:latest
    container_name: streamcontrol_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-GrafanaSecurePass2025!}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN:-midominio.local}/
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - internal_net
    depends_on:
      - prometheus

  # =========================================================================
  # 7. MAIN DATABASE: POSTGRESQL (NO HOST PORT EXPOSED)
  # =========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: streamcontrol_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-StreamControlSecretPass2025!}
      - POSTGRES_DB=${DB_NAME:-streaming_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net

  # =========================================================================
  # 8. BACKEND API: NESTJS (INTERNAL ONLY)
  # =========================================================================
  backend:
    build:
      context: ../backend
      dockerfile: ../infra/backend/Dockerfile
    container_name: streamcontrol_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-StreamControlSecretPass2025!}@postgres:5432/${DB_NAME:-streaming_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:-super_jwt_secret_streamcontrol_2025}
      - JWT_EXPIRES_IN=7d
      - FRONTEND_URL=https://${DOMAIN:-midominio.local}
      - PORT=3001
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN:-root_token_streamcontrol_2025}
      - VAULT_KEY_NAME=streaming-inventory
    networks:
      - internal_net
    depends_on:
      - postgres
      - vault-init

  # =========================================================================
  # 9. FRONTEND WEB APPLICATION: NEXT.JS (INTERNAL ONLY)
  # =========================================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/frontend/Dockerfile
    container_name: streamcontrol_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-midominio.local}/api
      - PORT=3000
    networks:
      - internal_net
    depends_on:
      - backend

networks:
  internal_net:
    name: streamcontrol_internal_net
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  crowdsec_data:
  crowdsec_config:
  authelia_data:
  redis_data:
  vault_data:
  prometheus_data:
  grafana_data:
  postgres_data:
